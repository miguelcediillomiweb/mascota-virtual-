<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10182b"><title>Mascota Virtual</title>
<link rel="stylesheet" href="css/mascota.css">
</head>
<body>
<header class="topbar"><div><strong>🐣 Mascota Virtual</strong><small>Una pequeña vida en tu pantalla</small></div><nav><button id="pauseBtn">Pausar</button><button id="resetBtn">Despertar</button></nav></header>
<main class="stage" id="stage" aria-label="Escenario de la mascota">
  <div class="window window-a"><div class="winbar"><i></i><i></i><i></i></div><div class="window-lines"></div></div>
  <div class="window window-b"><div class="winbar"><i></i><i></i><i></i></div><div class="window-lines"></div></div>
  <div class="floor"></div>
  <div id="effects" aria-hidden="true"></div>
  <button id="pet" class="pet walk" aria-label="Toca para despertar o acariciar a la mascota">
    <span class="speech" id="speech"></span>
    <svg class="duck" viewBox="0 0 128 112" role="img" aria-label="Patito amarillo con gorra morada">
      <g class="feet"><path d="M38 88 Q27 101 38 104 L57 104 Q65 99 51 94Z" fill="#e99a58" stroke="#171522" stroke-width="4"/><path d="M79 91 Q70 103 83 105 L102 102 Q109 97 91 92Z" fill="#e99a58" stroke="#171522" stroke-width="4"/></g>
      <path d="M18 48 Q18 16 55 18 Q82 7 101 34 Q119 48 110 76 Q104 99 69 99 L34 91 Q11 82 18 48Z" fill="#f7ed8a" stroke="#171522" stroke-width="5"/>
      <path d="M91 51 Q111 38 122 51 Q116 64 96 64Z" fill="#f3a66b" stroke="#171522" stroke-width="4"/>
      <path d="M82 38 Q91 26 104 38 Q112 48 103 62 L90 68 L80 57Z" fill="#f5bd8e" stroke="#171522" stroke-width="4"/>
      <ellipse cx="94" cy="51" rx="8" ry="11" fill="#fff" stroke="#171522" stroke-width="3"/><circle cx="97" cy="52" r="4" fill="#171522"/>
      <path d="M38 31 Q42 8 70 8 L94 12 L101 24 L78 25 L55 30Z" fill="#c14ee0" stroke="#171522" stroke-width="5"/>
      <path d="M36 32 L101 30 L104 38 L42 43Z" fill="#8b32bd" stroke="#171522" stroke-width="4"/>
      <path d="M57 17 L75 12 L80 25 L61 27Z" fill="#e78aff"/>
      <path d="M25 67 Q43 61 57 69 M31 78 Q48 72 61 79" fill="none" stroke="#d4c86f" stroke-width="4" opacity=".8"/>
    </svg>
    <span class="shadow"></span>
  </button>
  <div class="hint" id="hint">Tócame para despertarme · Arrástrame para moverme</div>
</main>
<section class="controls"><div><b id="status">Explorando</b><span id="detail">Está curioseando por aquí.</span></div><div class="actions"><button data-action="eat">🌱 Comer</button><button data-action="drink">💧 Beber</button><button data-action="sleep">💤 Dormir</button><button data-action="rocket">🚀 Luna</button><button data-action="run">💨 Correr</button></div></section>
<script src="js/cerebro.js"></script>
</body></html>
