name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**','web/**','.github/workflows/android-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Copy web pet into Android assets
        run: |
          mkdir -p android/app/src/main/assets/pet
          cp -r web/* android/app/src/main/assets/pet/
      - name: Build APK
        working-directory: android
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Mi-mascota-virtual.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mi-mascota-virtual
          path: android/app/build/outputs/apk/debug/Mi-mascota-virtual.apk